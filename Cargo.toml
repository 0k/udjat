[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/0k/udjat"

[workspace.dependencies]
agent-client-protocol = { version = "3.3", features = ["process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
clap = { version = "4", features = ["derive", "env"] }
colored = "3"
kal-log = "0.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
anyhow = "1"
async-trait = "0.1"
udjat-core = { path = "crates/udjat-core", version = "0.1.0" }
udjat-archive-claude-code = { path = "crates/udjat-archive-claude-code", version = "0.1.0" }
udjat-archive-opencode = { path = "crates/udjat-archive-opencode", version = "0.1.0" }
udjat-archive-pi = { path = "crates/udjat-archive-pi", version = "0.1.0" }
dirs = "5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
indoc = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
